<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

  <header class="site-header">
    <nav class="wrap">
      <a class="site-name" href="/">Sean Campbell</a>
      <div class="site-links">
        <a href="/blog/">Blog</a>
        <a href="https://github.com/campbellsean" target="_blank" rel="noopener">GitHub</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: "%Y" }} Sean Campbell · <a href="https://www.linkedin.com/in/seanpetercampbell/" target="_blank" rel="noopener">LinkedIn</a> · <a href="/classic/">my first websites</a></p>
    </div>
  </footer>

</body>
</html>
